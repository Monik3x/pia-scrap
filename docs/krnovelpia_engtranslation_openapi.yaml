          schema:
            type: integer
          description: Cache-busting timestamp (millisecond Unix timestamp)
          example: 1782829890640
      responses:
        "200":
          description: Novel review list JSON
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BaseResponse"
                  - type: object
