                    mem_no: 130334
                    count_view: 34980
                    count_comment: 21
                    count_good: 132
                    content_regdate: "2022-09-10 06:22:54"
                    novel_name: "용사 파티 때려치웁니다"
                    novel_no: 6269
                    novel_img: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
                    novel_img_all: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
                    novel_thumb: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
                    novel_thumb_all: "/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.file"
