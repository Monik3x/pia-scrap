      tags: [Novels]
      summary: Retrieve novel review list
      description: |
        Returns the work-review (novel-review) list for a specific novel.

        The `cmd=get_novel_review_list` and `target_novel_no` query parameters are required.
        The `_` parameter is a cache-busting timestamp and may be omitted.
      operationId: getNovelReviewList
      parameters:
        - name: cmd
