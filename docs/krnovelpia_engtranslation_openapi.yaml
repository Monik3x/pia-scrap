        This multi-purpose main-page processing endpoint selects its behavior using the `mode` parameter.

        | mode | Description |
        |------|------|
        | `getNewHotList` | Retrieve a new popular list |

        The response returns a list of popular novels (as an array in the `result` field).
      operationId: procMain
      requestBody:
        $ref: "#/components/requestBodies/GetNewHotListBody"
      responses:
