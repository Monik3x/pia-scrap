openapi: 3.1.0

info:
  title: Unofficial Novelpia API
  description: |
    This is an unofficial API specification for the Novelpia (novelpia.com) web novel platform.

    This was written through reverse engineering of the public web interface (the PNWC·NWC·WNC novel scraper series,
    and the betternovelpia userscript).

    ## Authentication
    Endpoints that require login use the `LOGINKEY` cookie.
    The cookie value is a string in the form `<hex_a>_<hex_b>`.

    Endpoints protected by CSRF must include the value of the page's `#csrf` element or
    the `csrf` value included in the `alarm_btn` JavaScript function in the payload.

    ## Notes
    - According to `robots.txt`, the `/proc/`, `/json/`, `/api/`, `/error/`, `/viewer/`, and `/comic_viewer/`
      paths are Disallowed for ordinary search-engine bots (except specified bots such as Googlebot·Yeti·Daum).
    - This API may change and is not officially supported.
    - To avoid server load, a reasonable delay (1–3 seconds) between requests is recommended.
  version: "0.1.0"
  contact:
    name: Novelpia
    url: https://novelpia.com

servers:
  - url: https://novelpia.com
    description: Novelpia Korean server

tags:
  - name: Page (HTML)
    description: HTML page endpoints rendered directly in a browser
  - name: Novels
    description: `/proc/` endpoints related to novel information and lists
  - name: Episodes
    description: `/proc/` endpoints related to episode lists and content
  - name: Users
    description: `/proc/` endpoints related to member information and actions (preferences·alerts·blocks)
  - name: Novel lists
    description: Novel list·ranking·search HTML pages (`/freestory`, `/plus`, `/top100`, `/search`)
  - name: Site-wide
    description: Common HTML pages such as login·registration·notices·shops·events
  - name: Arena
    description: Community board (Arena) HTML pages (`/arena`)

# ─────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────
components:

  # ── Security schemes ─────────────────────────────────────────────
  securitySchemes:
    loginKeyCookie:
      type: apiKey
      in: cookie
      name: LOGINKEY
      description: |
        Login session key. Format: `<32-hex-character string>_<32-hex-character string>`
        Example: `example-loginkey`

    csrfToken:
      type: apiKey
      in: cookie
      name: csrf
      description: |
        CSRF protection token. Extract it from the page DOM's `#csrf` element value or
        the `"csrf": "..."` value in the `alarm_btn` JS function.

  # ── Schemas ──────────────────────────────────────────────
  schemas:

    UserEmoticonItem:
      type: object
      description: |
        An owned emoticon item within a group in the response to `/proc/emoticon_proc?mode=get_user_emoticon`.
        (Its field structure differs from the items returned by `get_user_emoticon_group`, which lists groups.)
      properties:
        idx:
          type: integer
          description: Unique ID of the emoticon item
          example: 12068
        is_use:
          type: integer
          description: Whether it is available for use (1 = available)
          example: 1
        is_fav:
          type: integer
          description: Whether it is a favorite (1 = favorite)
          example: 0
        state:
          type: integer
          description: Emoticon status (same meaning as `state` in the group list)
          example: 8
        emoticon_url:
          type: string
          description: Emoticon image URL (protocol-relative path)
          example: "//images.novelpia.com/img/emoticon/174/12068.png"

    BaseResponse:
      type: object
      description: Common fields in all `/proc/` JSON responses
      properties:
        status:
          description: HTTP status code (string or integer)
          oneOf:
            - type: string
              example: "200"
            - type: integer
              example: 200
        errmsg:
          type: string
          description: Error message. Empty string when successful.
          example: ""
      required:
        - status
        - errmsg

    Novel:
      type: object
      description: Novelpia novel (work) information
      properties:
        novel_no:
          type: [integer, string]
          minimum: 1
          description: Unique novel number (ID)
          example: 372669
        novel_name:
          type: string
          description: Novel title
          example: "다크 판타지에서도 쌀은 먹고 살아야지?"
        novel_story:
          type: [string, "null"]
          description: Plot (work introduction). May be omitted from list responses
          example: "마녀가 지배하는 도시에서..."
        writer_nick:
          type: [string, "null"]
          description: Author pseudonym
          example: "미츄리"
        mem_nick:
          type: [string, "null"]
          description: Author pseudonym (may duplicate `writer_nick` because of a field-name issue)
          example: "미츄리"
        writer_original:
          type: [string, "null"]
          description: Original author (for translated or derivative works)
          example: ""
        mem_no:
          type: integer
          minimum: 1
          description: Author member number
          example: 28450
        main_genre:
          type: integer
          minimum: 0
          maximum: 14
          description: |
            Basic genre number
            - 0: Harem
            - 1: Fantasy
            - 2: Martial arts
            - 3: Modern
            - 4: (Unknown)
            - 5: Explicit
            - 6: Romance
            - 7: Alternate history
            - 8: Sports
            - 9: SF
            - 10: Other
            - 11: Parody
            - 12: Modern fantasy
            - 13: Light novel
            - 14: Horror
          example: 1
        novel_genre:
          oneOf:
            - type: string
              description: Detailed genre list (string serialized from a JSON array)
              example: '["판타지","라이트노벨","일상","로맨스"]'
            - type: array
              description: Detailed genre list (array format, used by some endpoints)
              items:
                type: string
              example: ["판타지", "중세", "하렘"]
        novel_type:
          type: integer
          enum: [1, 2]
          description: |
            Novel type
            - 1: PLUS (paid)
            - 2: Free serial publication
          example: 1
        novel_age:
          type: integer
          minimum: 0
          description: |
            Minimum viewing age
            - 0: All ages
            - 15: Age 15 and over
            - 19: Adult (age 19 and over)
          example: 0
        novel_live:
          type: integer
          enum: [0, 1, 2]
          description: |
            Publication status code (combined with `is_complete` and `is_del` to determine the final status)
            - 0: Ongoing
            - 1: Publication delayed
            - 2: Publication discontinued
          example: 0
        is_del:
          type: integer
          enum: [0, 1]
          description: Whether deleted (1 means deleted)
          example: 0
        is_complete:
          type: integer
          enum: [0, 1]
          description: Whether complete (1 means complete)
          example: 0
        is_monopoly:
          type: integer
          enum: [0, 1]
          description: Whether exclusive to the platform
          example: 1
        is_translation:
          type: integer
          enum: [0, 1]
          description: Whether this is a translated work
          example: 0
        flag_translate:
          type: integer
          enum: [0, 1]
          description: Whether this is a translated work (Korean-server field name; same as `is_translation`)
          example: 0
        is_secondary_creation:
          type: integer
          enum: [0, 1]
          description: Whether this is a derivative work
          example: 0
        is_donation_refusal:
          type: integer
          enum: [0, 1]
          description: Whether donations are refused
          example: 0
        is_contest:
          type: integer
          minimum: 0
          description: |
            Awarded contest ID (0 means none)
            - 2: 2021 Space Supreme Contest
            - 4: 2022 Novelpia Creation of Heaven and Earth Contest
            - 5: 2022 Masterpiece Adult Web Novel Contest
            - 7: 2022 Novelpia 2nd Space Supreme Contest
            - 12: 2023 Novelpia 3rd Space Supreme Contest
            - 17: 2024 Novelpia 4th Space Supreme Contest
          example: 0
        is_osmu:
          type: [string, "null"]
          description: OSMU (One Source Multi Use) platform identifier
          example: "toptoon"
        isbn:
          type: [string, "null"]
          description: International Standard Book Number (ISBN-13)
          example: "9791140400256"
        local_code:
          type: [string, "null"]
          description: Language/region code
          example: "KR"
        reg_date:
          type: [string, "null"]
          format: date-time
          description: Work registration timestamp
          example: "2021-01-07T12:00:00"
        complete_date:
          type: [string, "null"]
          format: date-time
          description: Publication end (completion) timestamp
          example: null
        last_write_date:
          type: [string, "null"]
          format: date-time
          description: Most recent (or scheduled) publication timestamp
          example: "2024-09-13T18:00:00"
        del_date:
          type: [string, "null"]
          format: date-time
          description: Work deletion timestamp
          example: null
        status_date:
          type: [string, "null"]
          format: date-time
          description: Server-side information update timestamp
          example: "2024-09-13T18:05:00"
        update_dt:
          type: [string, "null"]
          format: date-time
          description: Novel update timestamp
          example: "2024-09-13T18:00:00"
        count_view:
          type: integer
          minimum: 0
          description: View count
          example: 1500000
        count_good:
          type: integer
          minimum: 0
          description: Recommendation count
          example: 3200
        count_pick:
          type: [integer, "null"]
          minimum: 0
          description: Life-pick rank/count
          example: 242
        count_like:
          type: integer
          minimum: 0
          description: Preference count
          example: 1895
        count_alarm:
          type: integer
          minimum: 0
          description: Alert subscription count
          example: 1896
        count_book:
          type: integer
          minimum: 0
          description: Total episode count
          example: 150
        novel_thumb:
          type: [string, "null"]
          description: Novel thumbnail image URL (relative path)
          example: "//images.novelpia.com/imagebox/cover/11576a6b7d10e5a37598da89dfa7b3b6_369320_ori.wimg"
        rank_view:
          type: [string, integer, "null"]
          description: Ranking-basis view count (appears only in popular lists)
          example: "97810"
        rank_exp:
          type: [string, "null"]
          description: Ranking rise/fall information (generally null)
          example: null

    EpisodeTextLine:
      type: object
      description: One line of episode content
      properties:
        text:
          type: string
          description: |
            One line of body text.
            Blank lines are represented by the value `"&nbsp;"`.
          example: "마녀가 도시를 지배하기 시작했을 때,"

    EpisodeViewCount:
      type: object
      description: View-count entry for a specific episode
      properties:
        episode_no:
          type: integer
          description: Episode number (same as `ep_code`)
          example: 12606
        count_view:
          type: string
          description: View count (comma-separated numeric string)
          example: "1,057"

    MemberView:
      type: object
      description: Public member-profile statistics (the `result` in a `get_member_view` response)
      properties:
        mem_no:
          type: integer
          minimum: 1
          description: Unique member number
          example: 300142
        view_comment:
          type: ["integer", "null"]
          description: Comment visibility (null or integer; meaning unclear)
          example: null
        view_like_novel:
          type: integer
          description: Preferred-work visibility (0 = private, 1 = probably public)
          example: 0
        view_like_hash:
          type: integer
          description: Preferred-hashtag visibility (0 = private, 1 = probably public)
          example: 0
        view_sponsor:
          type: integer
          description: Donation visibility (0 = private, 1 = probably public)
          example: 0
        episode_cnt:
          type: integer
          minimum: 0
          description: Total number of episodes read by the member
          example: 76318
        comment_cnt:
          type: integer
          minimum: 0
          description: Number of comments by the member
          example: 0

    MemberBlockChk:
      type: object
      description: Check whether a specific member is blocked (the `result` in a `get_user_block_chk` response)
      properties:
        idx:
          type: integer
          description: Unique block-record ID
          example: 883261
        mem_no:
          type: integer
          minimum: 1
          description: Member number that performed the block (self)
          example: 2529720
        target_mem_no:
          type: integer
          minimum: 1
          description: Member number of the blocked target
          example: 4169856
        regdate:
          type: string
          format: date-time
          description: Block registration timestamp
          example: "2026-06-28 02:08:52"

    NovelReviewItem:
      type: object
      description: A single novel review (work review)
      properties:
        board_no:
          type: integer
          description: Board number (the work-review board is 5)
          example: 5
        content_no:
          type: integer
          description: Unique post ID
          example: 1660545
        content_cate:
          type: integer
          description: Post category (work reviews are 32)
          example: 32
        content_subject:
          type: string
          description: Review title
          example: "세상에서 가장 성능좋은 세탁기"
        content_link:
          type: string
          format: uri
          description: URL of the reviewed novel
          example: "https://novelpia.com/novel/6269"
        content_image:
          type: string
          description: Attached image (empty string if none)
          example: ""
        content_memo_linkno:
          type: integer
          description: Direct-link number for the review post
          example: 104678092
        content_adult:
          type: integer
          description: Adult-content flag (0 = general, 1 = adult)
          example: 0
        mem_nick:
          type: string
          description: Author nickname HTML (includes a badge img tag)
          example: "<b style='cursor:pointer;font-weight:500;' onclick=\"location='/user/130334';\">LaVan</b>"
        mem_no:
          type: integer
          description: Author member number
          example: 130334
        count_view:
          type: integer
          description: Review view count
          example: 34980
        count_comment:
          type: integer
          description: Comment count
          example: 21
        count_good:
          type: integer
          description: Recommendation count
          example: 132
        content_regdate:
          type: string
          format: date-time
          description: Review creation timestamp
          example: "2022-09-10 06:22:54"
        novel_name:
          type: string
          description: Novel title
          example: "용사 파티 때려치웁니다"
        novel_no:
          type: integer
          description: Novel number
          example: 6269
        novel_img:
          type: string
          description: Novel cover image path (relative path)
          example: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
        novel_img_all:
          type: string
          description: Full novel cover image path
          example: "/imagebox/cover/e5e9a54e3daee56446bf4fdb9b578b0e_16789365_q_ori.file"
        novel_thumb:
          type: string
          description: Novel thumbnail URL
          example: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
        novel_thumb_all:
          type: string
          description: Full novel thumbnail path
          example: "/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.file"
        user_img:
          type: string
          description: Author profile image HTML img tag (empty string if none)
          example: "<img src=\"https://phinf.pstatic.net/...\" class=\"rounded-circle s_inv\">"
        cover_url:
          type: string
          description: Novel cover URL (same as `novel_thumb`)
          example: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"

    PipeDelimitedResponse:
      type: string
      description: |
        A text response separated by pipe characters (`|`).

        Format: `{status}|{count}||{extra}`

        - `status`: `on` (enabled) · `off` (disabled) · `login` (login required)
        - `count`: Current count after enabling/disabling (integer)
        - `extra`: Reserved field (usually empty or `0`)
      examples:
        - "on|1896||0"
        - "off|1895||"
        - "login|0||"

  # ── Reusable request bodies ────────────────────────────────────────
  requestBodies:

    GetNewHotListBody:
      description: Request body for retrieving a new popular list
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [mode, period, target]
            properties:
              mode:
                type: string
                enum: [getNewHotList]
                example: "getNewHotList"
              period:
                type: string
                enum: [weekly, realtime]
                description: |
                  Aggregation period
                  - `weekly`: Weekly
                  - `realtime`: Real time
                example: "weekly"
              target:
                type: string
                enum: [complete, view, like]
                description: |
                  Sort criterion / target filter
                  - `complete`: Completed works
                  - `view`: By views
                  - `like`: By recommendations
                example: "complete"
              genre:
                type: [string, "null"]
                description: Korean genre name (for example, `판타지`, `무협`, `현대`). A blank value means "all"
                example: "판타지"
              main_genre:
                type: [string, "null"]
                description: Genre ID (0–14). Alternative format for the `genre` parameter. Using `genre` is generally recommended
                example: ""
              listpage:
                type: string
                description: Page number (starting at 0)
                default: "0"
                example: "0"

    GetEpisodeCountViewBody:
      description: Request body for batch episode view-count retrieval
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [cmd, novel_no]
            properties:
              cmd:
                type: string
                enum: [get_episode_count_view, get_episode_cnt_view]
                description: |
                  Processing command
                  - `get_episode_count_view`: New version
                  - `get_episode_cnt_view`: Legacy version
                example: "get_episode_count_view"
              novel_no:
                type: string
                description: Novel number
                example: "23"
            additionalProperties:
              type: string
              description: |
                `episode_arr[N]`-formatted episode-array item.

                **New version** (`cmd=get_episode_count_view`):
                  Key `episode_arr[N]`, value `"episode_count_view novel_count_view_{ep_code}"`

                **Legacy version** (`cmd=get_episode_cnt_view`):
                  Key `episode_arr[]`, value `"episode_cnt_view novel_cnt_view_{ep_code}"`

                Up to 20 items (the number of episodes per page) can be sent at once.
          examples:
            New version:
              summary: New-version parameters
              value:
                cmd: "get_episode_count_view"
                novel_no: "23"
            Legacy version:
              summary: Legacy-version parameters
              value:
                cmd: "get_episode_cnt_view"
                novel_no: "23"

    GetMemberViewBody:
      description: Request body for retrieving public member-profile statistics
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [mode, mem_no]
            properties:
              mode:
                type: string
                enum: [get_member_view]
                example: "get_member_view"
              mem_no:
                type: string
                description: Member number to query
                example: "300142"

    GetFavoriteNovelBody:
      description: Request body for retrieving a member's preferred-work list
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [mode, mem_no]
            properties:
              mode:
                type: string
                enum: [get_member_favorite_novel]
                example: "get_member_favorite_novel"
              mem_no:
                type: string
                description: Member number to query
                example: "12345"
              "paging[rowCount]":
                type: string
                description: Maximum number of items to retrieve at once
                default: "1000"
                example: "1000"
              "paging[curPage]":
                type: string
                description: Current page (starting at 1)
                default: "1"
                example: "1"
              "paging[order]":
                type: string
                description: Sort-field
                example: "date"
              "paging[sort][date]":
                type: string
                enum: ["0", "1"]
                description: |
                  Date sort direction
                  - `"0"`: Ascending
                  - `"1"`: Descending
                example: "1"

# ─────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════
  # HTML pages
  # ══════════════════════════════════════════════

  /novel/{novel_code}:
    get:
      tags: [Page (HTML)]
      summary: Novel main page
      description: |
        Returns an HTML page containing the novel title·author name·plot·genres·statistics, and more.

        | Situation | Modal message |
        |------|------------|
        | Deleted novel | `"삭제된 소설 입니다."` |
        | Private (practice) work | `"잘못된 접근입니다."` |
        | Invalid number | `"잘못된 소설 번호 입니다."` |

        HTTP 200 is returned even in these error situations.
      operationId: getNovelPage
      parameters:
        - name: novel_code
          in: path
          required: true
          description: Unique novel number
          schema:
            type: integer
            minimum: 1
          example: 23
      responses:
        "200":
          description: Novel page HTML
          content:
            text/html:
              schema:
                type: string

  /viewer/{ep_code}:
    get:
      tags: [Page (HTML)]
      summary: Episode viewer page (scroll mode)
      description: |
        An HTML page that displays episode content in a scrolling layout.
        When a PLUS episode is accessed while logged out, a subscription notice popup appears.
        `robots.txt` marks the entire `/viewer/` path as Disallowed for bots.
      operationId: getViewerPage
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: Unique episode number
          schema:
            type: integer
            minimum: 1
          example: 3790123
      responses:
        "200":
          description: Viewer HTML page
          content:
            text/html:
              schema:
                type: string

  /comic_viewer/{ep_code}:
    get:
      tags: [Page (HTML)]
      summary: Episode viewer page (paged/comic mode)
      description: |
        An HTML page that displays episode content in a page-turning (comic) layout.
        `robots.txt` marks the entire `/comic_viewer/` path as Disallowed for bots.
      operationId: getComicViewerPage
      security:
        - loginKeyCookie: []
        - {}
      parameters:
        - name: ep_code
          in: path
          required: true
          description: Unique episode number
          schema:
            type: integer
            minimum: 1
          example: 3790123
      responses:
        "200":
          description: Comic-mode viewer HTML page
          content:
            text/html:
              schema:
                type: string

  /user/{mem_no}:
    get:
      tags: [Page (HTML)]
      summary: Member profile page
      description: Returns the public profile page for a specific member.
      operationId: getUserProfilePage
      parameters:
        - name: mem_no
          in: path
          required: true
          description: Unique member number
          schema:
            type: integer
            minimum: 1
          example: 28450
      responses:
        "200":
          description: Member profile HTML page
          content:
            text/html:
              schema:
                type: string

  /mybook:
    get:
      tags: [Page (HTML)]
      summary: My library page
      description: |
        This is the My Library page containing the logged-in member's preferred works (likes).
        Access without a login cookie redirects to the login page.
      operationId: getMyBookPage
      security:
        - loginKeyCookie: []
      responses:
        "200":
          description: My Library HTML page
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Not logged in → redirect to login page

  /notice/{category}/view_{post_code}/:
    get:
      tags: [Page (HTML)]
      summary: Notice page
      operationId: getNoticePage
      parameters:
        - name: category
          in: path
          required: true
          description: "Category slug (for example, `20`, `all`)"
          schema:
            type: string
          example: "20"
        - name: post_code
          in: path
          required: true
          description: Unique post number
          schema:
            type: integer
            minimum: 1
          example: 1392
      responses:
        "200":
          description: Notice HTML page
          content:
            text/html:
              schema:
                type: string

  /faq/{category}/view_{post_code}/:
    get:
      tags: [Page (HTML)]
      summary: FAQ page
      operationId: getFaqPage
      parameters:
        - name: category
          in: path
          required: true
          description: "Category slug (for example, `all`)"
          schema:
            type: string
          example: "all"
        - name: post_code
          in: path
          required: true
          description: Unique FAQ post number
          schema:
            type: integer
            minimum: 1
          example: 383218
      responses:
        "200":
          description: FAQ HTML page
          content:
            text/html:
              schema:
                type: string

  # ══════════════════════════════════════════════
  # Novel-related proc endpoints
