# ─────────────────────────────────────────────────────────────
# Extension information (notes)
# ─────────────────────────────────────────────────────────────
x-novelpia-cookies:
  description: |
    Major cookies used by Novelpia

    | Name | Example value | Description |
    |------|---------|------|
    | `LOGINKEY` | `example-loginkey` | Login session key |
    | `USERKEY` | `example-userkey` | User identifier |
    | `NPD{DD}{MM}1` | `NPD15081=meta` | Same-day generic cookie (DD = day, MM = month) |
    | `NPK{MM}{DD}` | `NPK0811=OObWV0YQ..` | Same-day auxiliary cookie |
    | `SITE_LANG` | `ko-KR` | Site language setting |
    | `REF_DATA` | `/novel/1` | Last visited path |
    | `PRIVATE_MODE` | `error` | Privacy-related processing |

x-novelpia-robots:
  description: |
    `robots.txt` summary

    - `User-agent: *` → `Disallow: /` (blocks all ordinary bots)
    - The following bots are allowed (except for the paths below):
      Googlebot / Yeti / Daum / Daumoa / Ads-Naver / facebookexternalhit
      - `Disallow: /proc/`
      - `Disallow: /json/`
      - `Disallow: /api/`
      - `Disallow: /error/`
      - `Disallow: /viewer/`
      - `Disallow: /comic_viewer/`

x-novelpia-html-selectors:
  description: |
    Major CSS selectors used for HTML parsing

    **Episode list (`episode_list` response)**

    | Selector | Target |
    |--------|------|
    | `table.s_inv` | Episode-list table |
    | `tr.ep_style5` | Episode row. `ep_code` is included in the `data-episode-no` attribute |
    | `span.s_inv` | Episode-type tag (free·adult) |
    | `.b_free` | Free-episode class |
    | `.b_19` | Adult (19+) episode class |
    | `span.episode_count_view.novel_count_view_{ep_code}` | Per-episode view-count widget |
    | `i.ion-document-text` | Character-count icon |
    | `i.ion-chatbox-working` | Comment-count icon |
    | `i.ion-thumbsup` | Recommendation-count icon |
    | `.page-link` | Page link (used to extract the novel number) |

    **Viewer page**

    | Selector | Target |
    |--------|------|
    | `#novel_box` | Viewer-body scrolling container |
    | `#episode_list` | Episode-list container |
    | `#comment_load` | Comment-list container |
    | `#csrf` | CSRF-token input element |
    | `.menu-top-tag` | Episode-number tag (for example, `EP.1`) |
    | `#header_bar` | Top header bar |
    | `#footer_bar` | Bottom footer bar |
    | `#novel_drawing` | Novel illustration area |
    | `#m-sidemenu .sidemenu-support` | Side menu (support) |

x-novelpia-episode-num-format:
  description: |
    Episode number (`num`) display format

    | Display | Meaning |
    |------|------|
    | `EP.0` | Prologue |
    | `EP.N` | Episode N (starting at 1) |
    | `BONUS` | Bonus episode |

    New prologues cannot be registered after May 16, 2022.
    The epilogue feature was removed on May 16, 2022.

x-novelpia-date-format:
  description: |
    Episode-list date display format

    | Original format | Meaning |
    |-----------|------|
    | `YY.MM.DD` | Past date (for example, `21.01.07` → `2021-01-07`) |
    | `N hours ago` | Posted within 24 hours (N hours before the current time) |
    | `N minutes ago` | Posted within 24 hours (N minutes before the current time) |
    | `N hours from now` | Scheduled episode (published N hours after the current time) |
    | `N minutes from now` | Scheduled episode (published N minutes after the current time) |

    Scheduled episodes appear in the list starting 24 hours before publication.
