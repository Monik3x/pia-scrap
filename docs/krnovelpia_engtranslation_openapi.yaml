                    cover_url: "//images.novelpia.com/imagebox/cover/f636f1f08147f05e291296e79ba74726_390878_ori.wimg"
    post:
      tags: [Novels]
      summary: Novel-related processing (multi-purpose)
      description: |
        This multi-purpose novel-processing endpoint selects its behavior using the `cmd` parameter.

        | cmd | Description |
        |-----|------|
        | `get_episode_count_view` | Batch episode view-count retrieval (new version) |
        | `get_episode_cnt_view` | Batch episode view-count retrieval (legacy version) |

        The two `cmd` values provide the same function; only the parameter names differ.
      operationId: procNovel
      requestBody:
        $ref: "#/components/requestBodies/GetEpisodeCountViewBody"
      responses:
        "200":
          description: Episode view-count JSON
